commands:
  ask:
    description: Ask a computer expert
    initial_state: initial
    templates:
      initial:
        variables:
          - name: Input
            type: stdin|arg
        system: |
          You are a computer expert specializing in Linux/Windows shell commands, scripting, 
          and system administration tasks. Be concise and direct in your responses.
        prompt: |
          For each question:

          1. If it's a command request:
            - Provide the exact command without explanation
            - Add only critical flags/options
            - Include a single-line comment explaining the command (if needed)
            - Format as a code block

          2. If it's a scripting question:
            - Give the shortest working solution
            - Include only essential error handling
            - Format as a code block

          3. If it's a conceptual question:
            - Provide a max 2-sentence answer
            - Include a command example if relevant

          Question: {{ .Vars.Input }}
        next_states: [follow_up]

      follow_up:
        variables:
          - name: Input
            type: stdin|arg
        system: |
          Continue the computer expert conversation, maintaining context from previous responses.
        prompt: |
          Follow-up question: {{ .Vars.Input }}
        next_states: [follow_up, initial]

  summarize:
    description: Summarize a text
    initial_state: summarize
    templates:
      summarize:
        variables:
          - name: Input
            type: stdin|arg
        system: |
          You are a text summarization expert. Provide clear, concise summaries.
        prompt: |
          Please summarize the following text:
          {{ .Vars.Input }}

  git-commit:
    description: Generate semantic git commit messages
    initial_state: analyze
    templates:
      analyze:
        variables:
          - name: RecentCommits
            type: exec
            exec: git log -3 --pretty=format:"%s"
          - name: Input
            type: stdin|arg|exec
            exec: git diff --cached
        system: |
          You are a git commit message expert. Generate semantic commit messages following conventions.
        prompt: |
          Generate a git commit message following this structure:

          1. First line: conventional commit format (type: concise description)
          2. Optional bullet points for additional context

          Recent commits:
          {{ .Vars.RecentCommits }}

          Changes:
          ```
          {{ .Vars.Input }}
          ```
        next_states: [security_check]

      security_check:
        system: |
          You are a security expert checking for sensitive information in git diffs.
        prompt: |
          Check the following diff for sensitive information (API keys, passwords, tokens, etc.):
          ```
          {{ .Vars.Input }}
          ```
          Return "#ERROR# 🚨 Potential secret detected" if found, otherwise proceed with commit message.

  analyze:
    description: Analyze code files
    initial_state: analyze
    templates:
      analyze:
        system: |
          You are a code analysis expert. Provide clear insights about code structure and quality.
        prompt: |
          Please analyze these code files:

          {{range $filePath, $content := .Files}}
          File: {{$filePath}}
          ```
          {{$content}}
          ```
          {{end}}
